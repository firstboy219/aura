openapi: 3.1.0
info:
  title: AURA Core API
  version: 0.1.0-p1
  description: |
    Phase 1 endpoints only (Master Blueprint §11). Bound to loopback by default.
    Every request requires a bearer token read from a 0600 file outside the repository.
    There is no shell or arbitrary-execution endpoint.
servers:
  - url: http://127.0.0.1:7400/api/v1
security:
  - bearer: []
paths:
  /tasks:
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    get:
      operationId: listTasks
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/TaskState' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
                  next_cursor: { type: [string, 'null'] }
  /tasks/{id}:
    get:
      operationId: getTask
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /tasks/{id}/events:
    get:
      operationId: getTaskEvents
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { name: after_seq, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Task trace (append-only event log)
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/TaskEvent' } }
  /tasks/{id}/input:
    post:
      operationId: answerQuestion
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [answer], properties: { answer: { type: string, minLength: 1, maxLength: 4000 } } } } }
      responses: { '200': { $ref: '#/components/responses/TaskOK' }, '409': { $ref: '#/components/responses/Error' } }
  /tasks/{id}/priority:
    post:
      operationId: setPriority
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [priority], properties: { priority: { type: integer, minimum: -100, maximum: 100 } } } } } }
      responses: { '200': { $ref: '#/components/responses/TaskOK' } }
  /tasks/{id}/context:
    post:
      operationId: addOwnerContext
      description: Owner correction or added instruction; reaches every task in the tree at its next step.
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [content], properties: { content: { type: string, minLength: 1, maxLength: 4000 } } } } } }
      responses: { '200': { $ref: '#/components/responses/TaskOK' }, '409': { $ref: '#/components/responses/Error' } }
  /tasks/{id}/tree:
    get:
      operationId: getTaskTree
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '200': { description: Task with subagents and rolled-up cost, content: { application/json: { schema: { $ref: '#/components/schemas/TreeNode' } } } }
  /tasks/{id}/timeline:
    get:
      operationId: getTimeline
      description: Activity timeline derived from Core events (completed steps, current state, wait reason, next step, blockers, spend, pending owner decisions).
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses: { '200': { description: Timeline, content: { application/json: { schema: { type: object } } } } }
  /tasks/{id}/files:
    get:
      operationId: listFiles
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses: { '200': { description: Workspace files, content: { application/json: { schema: { type: object, properties: { files: { type: array, items: { type: object, properties: { path: { type: string }, bytes: { type: integer } } } } } } } } } }
  /tasks/{id}/files/{path}:
    get:
      operationId: readFile
      parameters: [ { $ref: '#/components/parameters/TaskId' }, { name: path, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: File content, content: { text/plain: { schema: { type: string } } } }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /stream:
    get:
      operationId: stream
      description: Server-Sent Events of task events in ULID order; resume with Last-Event-ID or ?after=; optional task_id filter.
      parameters:
        - { name: task_id, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: string } }
      responses: { '200': { description: text/event-stream, content: { text/event-stream: { schema: { type: string } } } } }
  /self:
    get: { operationId: getSelf, description: Who AURA is, what it can do, its measured weaknesses and how it improves; every fact from Core records, no model., responses: { '200': { description: Self description } } }
  /limitations:
    get: { operationId: listLimitations, description: Limitation Ledger (Blueprint 8A.5), parameters: [ { name: status, in: query, schema: { type: string } } ], responses: { '200': { description: Ledger entries with remedies } } }
    post: { operationId: addLimitation, description: Owner-recorded limitation, responses: { '201': { description: Created } } }
  /limitations/{id}/{action}:
    post: { operationId: limitationAction, description: 'Owner decision: dismiss, accept (wont_fix) or reopen', parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: action, in: path, required: true, schema: { enum: [dismiss, accept, reopen] } } ], responses: { '200': { description: Updated entry } } }
  /improvement/run:
    post: { operationId: runImprovement, description: One pass of the self-improvement loop now (it also runs by itself at the lowest priority), responses: { '200': { description: Summary } } }
  /memories:
    get: { operationId: listMemories, responses: { '200': { description: Memories with provenance } } }
    post: { operationId: addMemory, responses: { '201': { description: Created } } }
  /skills:
    get: { operationId: listSkills, responses: { '200': { description: Skills } } }
  /skills/import:
    post: { operationId: importSkill, description: "Owner: store a guidance skill (name, triggers, notes up to 2000 characters; no plan template, no permissions).", responses: { '200': { description: Skill } } }
  /profile:
    get: { operationId: listProfile, responses: { '200': { description: Owner Working Profile } } }
    post: { operationId: addPreference, responses: { '201': { description: Created } } }
  /triggers:
    get: { operationId: listTriggers, responses: { '200': { description: Schedules and watches } } }
    post: { operationId: createTrigger, responses: { '201': { description: Created } } }
  /notifications:
    get: { operationId: listNotifications, responses: { '200': { description: Owner notifications (findings) } } }
  /ui/home:
    get: { operationId: uiHome, description: "The active design of the home screen plus the Core's context of this moment (what is waiting, time of day, suggested scene) (ADR-0060).", responses: { '200': { description: Screen and context } } }
  /ui/screens/{name}:
    get: { operationId: uiScreen, description: "Active design, stored versions and the built-in default of a screen. A redesign is a task: POST /tasks with design=<name>.", responses: { '200': { description: Screen versions } } }
  /ui/screens/{name}/{action}:
    post: { operationId: uiScreenAction, description: "rollback (previous design) | reset (built-in default) | use (body version).", responses: { '200': { description: Active screen } } }
  /notes:
    get: { operationId: listNotes, description: "The owner's notes, newest first (ADR-0061). A reply's note block is saved here by the Core.", responses: { '200': { description: Notes } } }
    post: { operationId: addNote, description: "Body text.", responses: { '201': { description: Note } } }
  /notes/{id}:
    patch: { operationId: updateNote, description: "Body text and/or done.", responses: { '200': { description: Note } } }
    delete: { operationId: deleteNote, responses: { '200': { description: Deleted } } }
  /media/{id}:
    get: { operationId: getMedia, description: "A picture the Core stored for a figure of a reply (JPEG, PNG or WebP; ADR-0061).", responses: { '200': { description: Image bytes } } }
  /self-model:
    get: { operationId: getSelfModel, responses: { '200': { description: Measured capabilities } } }
  /scorecard:
    get: { operationId: getScorecard, responses: { '200': { description: Efficiency scorecard } } }
  /admin/usage:
    get: { operationId: adminUsage, description: "Owner: usage by department|member|day|tier|task_class|model (ADR-0049).", responses: { '200': { description: Usage groups } } }
  /admin/audit/verify:
    get:
      operationId: adminAuditVerify
      description: "Owner: re-compute the audit hash chain (ODI A3, ADR-0072). 200 when intact, 409 with broken_at/broken_why when a row was edited, removed or inserted. Anchor `head` outside this database."
      responses:
        '200': { description: Chain intact, content: { application/json: { schema: { $ref: '#/components/schemas/AuditChain' } } } }
        '409': { description: Chain broken, content: { application/json: { schema: { $ref: '#/components/schemas/AuditChain' } } } }
  /admin/nexus:
    get: { operationId: getNexus, description: "Owner: NEXUS gateway policy, objective health state with its evidence, active fallback authorizations and the 24 h shadow summary (ODI A4, ADR-0073).", responses: { '200': { description: Status } } }
    put:
      operationId: putNexus
      description: "Owner: merge policy fields (mode off|shadow|primary, base_url, fallback_providers, fallback_data_classes, fallback_budget_usd, fallback_max_calls, fallback_ttl_minutes, teacher_*). Becoming primary requires NEXUS to answer consecutive readiness probes now (409 NEXUS_HEALTH_UNKNOWN otherwise). Defaults deny: no provider is approved for fallback or the Teacher Gate until named. The limits (fallback budget/call count, Teacher Gate budget/daily limit, teaching daily cap) apply to PAID routes only: free routes are tried first and are unlimited. overflow_to_external (default false) lets a PUBLIC call that NEXUS cannot take (context too small, or not finished within overflow_timeout_seconds, 5..300) be served by an external AI in primary mode, under the same limits (ADR-0079); shadow_percent (0..100) samples shadow calls; teach_enabled keeps what external providers answered for PUBLIC tasks (never private ones) and sends it to NEXUS to learn from (teach_daily_max per day)."
      responses: { '200': { description: Status }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /admin/nexus/owner-disable:
    post:
      operationId: nexusOwnerDisable
      description: "Owner: switch NEXUS off for N minutes (1..1440), the second valid trigger for fallback; 0 switches it back on and revokes every fallback authorization."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [minutes], additionalProperties: false, properties: { minutes: { type: integer, minimum: 0, maximum: 1440 } } } } } }
      responses: { '200': { description: Status }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /teacher/requests:
    post:
      operationId: teacherRequest
      description: "NEXUS asks to learn from an external AI through AURA (Teacher Gate). Own service token (vault connector.teacher_service_token), not the owner's. Refused unless the owner enabled the gate and named a provider; the question must pass the sanitizer; the answer is returned as untrusted external-ai data."
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [question], additionalProperties: false, properties: { gap: { type: string }, question: { type: string, maxLength: 1500 }, expected_form: { type: string } } } } } }
      responses: { '200': { description: Untrusted answer (trust untrusted, source_type external-ai) }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '502': { $ref: '#/components/responses/Error' } }
  /admin/tool-manifests:
    get: { operationId: toolManifests, description: "Owner: the manifest of every registered tool (side effect, tier, risk label, network destination class, data classes, idempotency); manifest_gaps counts tools missing declared facts (ODI A5).", responses: { '200': { description: Manifests } } }
  /admin/tool-quotas:
    get: { operationId: getToolQuotas, description: "Owner: per-tool daily quotas (steps per UTC day).", responses: { '200': { description: Quotas } } }
    put: { operationId: putToolQuotas, description: "Owner: replace the quotas ({quotas: {tool_id: n}}, 0 removes). Audited. A step past its tool's quota is denied as tool_quota_exceeded.", responses: { '200': { description: Quotas }, '400': { $ref: '#/components/responses/Error' } } }
  /devices:
    get: { operationId: listDevices, description: "Owner: paired devices (ODI A6).", responses: { '200': { description: Devices } } }
  /devices/pairings:
    post: { operationId: startDevicePairing, description: "Owner: start a pairing; returns a one-time challenge (shown once).", responses: { '201': { description: Pairing }, '400': { $ref: '#/components/responses/Error' } } }
  /devices/pairings/{id}/complete:
    post: { operationId: completeDevicePairing, security: [], description: "Device: complete a pairing with the challenge, its ed25519 public key and a signature proving it holds the key. Rate limited. The device is pending until the owner confirms it.", parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '202': { description: Pending }, '403': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } } }
  /devices/{id}/confirm:
    post: { operationId: confirmDevice, description: "Owner: trust a pending device with a subset of the capabilities it requested (web: TOTP step-up code).", parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: Trusted }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } } }
  /devices/{id}/revoke:
    post: { operationId: revokeDevice, description: "Owner: revoke a device at once; its leases end and the tasks it held stay paused.", parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: Revoked } } }
  /devices/self/heartbeat:
    post: { operationId: deviceHeartbeat, security: [], description: "Device (ed25519-signed headers X-Aura-Device, X-Aura-Timestamp, X-Aura-Nonce, X-Aura-Signature).", responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } } }
  /devices/self/leases:
    post: { operationId: deviceBeginLease, security: [], description: "Device (signed): take over a task; automation on it pauses. 409 when the task is already leased.", responses: { '201': { description: Lease }, '409': { $ref: '#/components/responses/Error' } } }
  /devices/self/leases/{id}/release:
    post: { operationId: deviceReleaseLease, security: [], description: "Device (signed): hand back with the sha256 of a fresh observation (422 without one).", parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: Released }, '422': { $ref: '#/components/responses/Error' } } }
  /admin/changes:
    get: { operationId: listChanges, description: "Owner: self-engineering change proposals (ODI A8), optional ?status=.", responses: { '200': { description: Changes } } }
    post: { operationId: createChange, description: "File a change proposal. The level (L0-L3) is computed from the paths it touches; L2/L3 need tests, rollback plan and risks; a diff that weakens its own tests is recorded as blocked. proposed_by agent:<name> marks an automated proposer.", responses: { '201': { description: Change }, '422': { $ref: '#/components/responses/Error' } } }
  /admin/changes/{id}:
    get: { operationId: getChange, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: Change }, '404': { $ref: '#/components/responses/Error' } } }
  /admin/changes/{id}/decide:
    post: { operationId: decideChange, description: "Approve or reject. L2 needs the owner; L3 (and agent-proposed L2) needs the owner with a fresh TOTP code; nobody approves their own proposal unless they are the owner; a blocked change cannot be approved.", parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: Change }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /admin/changes/{id}/move:
    post: { operationId: moveChange, description: "Record a rollout step (in_canary, deployed, accepted, rolled_back) with evidence. Accepting needs post_deploy_health evidence with ok=true and the owner; a rollback needs a note.", parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: Change }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /admin/retention:
    get: { operationId: retentionReport, description: "Owner: dry run of the retention proposal (odi.retention): what WOULD be purged. Nothing is deleted (ODI A7).", responses: { '200': { description: Report } } }
  /notifications/{id}/snooze:
    post: { operationId: snoozeNotification, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [minutes], additionalProperties: false, properties: { minutes: { type: integer, minimum: 1, maximum: 10080 } } } } } }, responses: { '200': { description: Snoozed } } }
  /notifications/{id}/ack:
    post: { operationId: ackNotification, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: Acknowledged } } }
  /memories/{id}/expiry:
    post: { operationId: setMemoryExpiry, description: "Set (days > 0) or clear (0) a memory's expiry; an expired memory is never retrieved as a fact and is retired by the maintenance tick (ODI A7).", parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [days], additionalProperties: false, properties: { days: { type: integer, minimum: 0, maximum: 3650 } } } } } }, responses: { '200': { description: Memory } } }
  /admin/audit:
    get: { operationId: adminAudit, description: "Owner: audit search (type, actor, task_id, since, until, q, limit); format=csv|jsonl exports and is audited.", responses: { '200': { description: Audit events or export file } } }
  /aul/check:
    post: { operationId: aulCheck, description: "Compile and check an AUL workflow; returns diagnostics or its declared capabilities (ADR-0050).", responses: { '200': { description: Check result } } }
  /workflows:
    get: { operationId: listWorkflows, responses: { '200': { description: Registered AUL workflows } } }
    post: { operationId: registerWorkflow, description: "Owner: register a new workflow version.", responses: { '201': { description: Registered }, '400': { description: Diagnostics } } }
  /workflows/{id}:
    get: { operationId: getWorkflow, description: "By id, or the active version by name.", responses: { '200': { description: Workflow } } }
  /workflows/{id}/run:
    post: { operationId: runWorkflow, description: "Start a task running the workflow; body inputs, optional budget.", responses: { '201': { description: Task } } }
  /workflows/{id}/disable:
    post: { operationId: disableWorkflow, responses: { '200': { description: Workflow } } }
  /brain/variants:
    get: { operationId: listBrainVariants, description: "L3 brain variants from AURA Lab (ADR-0048); ?status= filters.", responses: { '200': { description: Variants } } }
  /brain/variants/{id}:
    get: { operationId: getBrainVariant, responses: { '200': { description: Variant with guidance, sha256, Lab report and rollout } } }
  /brain/variants/{id}/{action}:
    post:
      operationId: brainVariantAction
      description: "approve (owner; body sha256, plus code for web step-up) starts the canary rollout; reject; rollback (body reason)."
      responses: { '200': { description: Variant }, '409': { description: Wrong state }, '401': { description: Step-up required } }
  /routing/shadow:
    get: { operationId: getShadowRouting, responses: { '200': { description: Shadow routing comparison } } }
  /events:
    post:
      operationId: postExternalEvent
      description: External dependency signal for the supervisor; idempotent by (key, dedup_id).
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }, dedup_id: { type: string, maxLength: 128 }, payload: { type: object } } } } } }
      responses:
        '202': { description: Recorded, content: { application/json: { schema: { type: object, properties: { id: { type: string }, duplicate: { type: boolean } } } } } }
        '200': { description: Duplicate (already recorded) }
  /webhooks/{name}:
    post:
      operationId: postWebhook
      security: []
      description: "Authenticated inbound webhook (ADR-0034). No bearer token; the request must carry X-Aura-Timestamp (unix seconds, within 5 minutes) and X-Aura-Signature: sha256=<hex HMAC-SHA256(secret, timestamp + '.' + body)>. Optional X-Aura-Delivery deduplicates. The JSON body (at most 16 KiB) becomes the payload of the webhook's configured external event."
      parameters: [ { name: name, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,40}$' } } ]
      requestBody: { required: true, content: { application/json: { schema: {} } } }
      responses:
        '202': { description: Event recorded, content: { application/json: { schema: { type: object, properties: { id: { type: string }, duplicate: { type: boolean } } } } } }
        '200': { description: Duplicate delivery (already recorded) }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /tasks/{id}/cancel:
    post: { operationId: cancelTask, parameters: [ { $ref: '#/components/parameters/TaskId' } ], responses: { '200': { $ref: '#/components/responses/TaskOK' }, '409': { $ref: '#/components/responses/Error' } } }
  /tasks/{id}/pause:
    post: { operationId: pauseTask, parameters: [ { $ref: '#/components/parameters/TaskId' } ], responses: { '200': { $ref: '#/components/responses/TaskOK' }, '409': { $ref: '#/components/responses/Error' } } }
  /tasks/{id}/resume:
    post: { operationId: resumeTask, parameters: [ { $ref: '#/components/parameters/TaskId' } ], responses: { '200': { $ref: '#/components/responses/TaskOK' }, '409': { $ref: '#/components/responses/Error' } } }
  /approvals:
    get:
      operationId: listApprovals
      responses:
        '200':
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                required: [approvals]
                properties:
                  approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
  /approvals/{id}/approve:
    post:
      operationId: approve
      parameters: [ { $ref: '#/components/parameters/ApprovalId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_hash]
              additionalProperties: false
              properties:
                action_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: Must equal the pending approval's canonical hash }
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /approvals/{id}/revoke:
    post:
      operationId: revokeApproval
      description: "Owner: withdraw an approval that is pending or approved but not yet used (ODI A3). The step and task fail with reason approval_revoked and the task's grants are revoked. A consumed approval cannot be revoked."
      parameters: [ { $ref: '#/components/parameters/ApprovalId' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { reason: { type: string, maxLength: 300 } } }
      responses:
        '200': { description: Revoked (status invalidated, revoked_at set), content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /approvals/{id}/reject:
    post:
      operationId: reject
      parameters: [ { $ref: '#/components/parameters/ApprovalId' } ]
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /system/health:
    get:
      operationId: health
      security: []
      responses:
        '200': { description: Live and ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { description: Live but not ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /system/resources:
    get:
      operationId: resources
      responses:
        '200':
          description: Resource and worker state
          content:
            application/json:
              schema:
                type: object
                properties:
                  core_rss_bytes: { type: integer }
                  worker: { type: object, properties: { state: { enum: [stopped, starting, idle, busy, crashed] }, pid: { type: [integer, 'null'] }, rss_bytes: { type: [integer, 'null'] } } }
                  db: { type: object, properties: { wal_bytes: { type: integer }, write_queue_depth: { type: integer } } }
                  budget_today: { type: object, properties: { reserved_usd: { type: number }, spent_usd: { type: number }, limit_usd: { type: number } } }
  /system/stop:
    post:
      operationId: killSwitch
      description: Cancels in-flight provider calls, stops worker and tool execution, blocks new calls, preserves recoverable state.
      responses:
        '202': { description: Stop accepted, content: { application/json: { schema: { type: object, properties: { stopped_tasks: { type: integer } } } } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    TaskId: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    ApprovalId: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
  responses:
    TaskOK: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
    Error: { description: Structured error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    TaskState:
      enum: [CREATED, PLANNING, RUNNING, WAITING_APPROVAL, WAITING_INPUT, WAITING_EXTERNAL, SCHEDULED, PAUSED, COMPLETED, FAILED, CANCELLED, BUDGET_EXCEEDED]
    TaskCreate:
      type: object
      additionalProperties: false
      required: [objective]
      properties:
        objective: { type: string, minLength: 1, maxLength: 8000 }
        tools: { type: array, items: { enum: [web.fetch, workspace.read, workspace.write] } }
        allow_domains: { type: array, items: { type: string }, maxItems: 50 }
        data_class: { enum: [private, public], default: private, description: Only public tasks may use model routes that may log prompts (free endpoints) }
        tier: { enum: [fast, standard, deep], description: Owner override of the cascade policy for the whole task }
        recovery: { enum: [auto, manual, never], default: auto, description: "What a Core restart does with the interrupted task: resume, PAUSED for the owner, or FAILED. An unknown external outcome always waits for the owner." }
        reply: { enum: ['', none], default: '', description: "Owner reply (ADR-0055): by default every root task ends with a reply; 'none' turns it off for this task." }
        budget:
          type: object
          additionalProperties: false
          properties:
            max_cost_usd: { type: number, exclusiveMinimum: 0 }
            max_iterations: { type: integer, minimum: 1 }
            max_wall_seconds: { type: integer, minimum: 1 }
    Task:
      type: object
      required: [id, state, objective, created_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        state: { $ref: '#/components/schemas/TaskState' }
        reason: { type: [string, 'null'] }
        reason_code: { type: [string, 'null'], description: Canonical failure-taxonomy code (BUDGET_EXCEEDED, POLICY_DENIED, PROVIDER_UNAVAILABLE, VERIFICATION_FAILED, ...) }
        task_class: { type: [string, 'null'] }
        objective: { type: string }
        parent_task_id: { type: [string, 'null'] }
        root_task_id: { $ref: '#/components/schemas/Ulid' }
        agent_role: { type: string, default: main }
        depth: { type: integer, default: 0 }
        cost_usd: { type: number, description: Spent plus currently reserved }
        budget: { type: object, properties: { max_cost_usd: { type: number }, max_iterations: { type: integer }, max_wall_seconds: { type: integer } } }
        tools: { type: array, items: { type: string } }
        allow_domains: { type: array, items: { type: string } }
        data_class: { enum: [private, public] }
        recovery: { enum: [auto, manual, never] }
        priority: { type: integer }
        replans: { type: integer }
        tier: { type: [string, 'null'] }
        question: { type: string, description: Pending clarification question (WAITING_INPUT only) }
        reply: { $ref: '#/components/schemas/Reply' }
        assurance: { $ref: '#/components/schemas/Assurance' }
        wait_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Assurance:
      type: object
      description: >
        Derived, never stored (ADR-0071, ODI Blueprint v1.1 §5 and §15). canonical_state is the Blueprint state for this task; extension names an AURA state the
        Blueprint has none for. verification_level says what evidence stands behind the result: V0 attempted, V1 the tool reported success, V2 a postcondition was
        observed, V3 independently confirmed. claim is what AURA may truthfully say; a V1 result is never "completed_verified".
      required: [canonical_state, verification_level, claim, steps_total, steps_succeeded, steps_failed, steps_outstanding]
      properties:
        canonical_state: { type: string }
        extension: { type: string }
        verification_level: { enum: [none, V0, V1, V2, V3] }
        claim: { enum: [in_progress, waiting, completed_verified, completed_unverified, attempted_only, completed_no_side_effect, partial, failed, uncertain, cancelled] }
        steps_total: { type: integer }
        steps_succeeded: { type: integer }
        steps_failed: { type: integer }
        steps_outstanding: { type: integer }
        uncertain: { type: boolean }
    Reply:
      type: object
      description: What AURA told the owner about a finished task, with an adaptive view the client draws natively (ADR-0055).
      required: [task_id, text, view, basis, notes, files, created_at]
      properties:
        task_id: { $ref: '#/components/schemas/Ulid' }
        text: { type: string }
        basis: { enum: [evidence, model_knowledge, summary], description: "evidence: written from what the task read, computed or wrote. model_knowledge: no tool was used, not checked. summary: composed by the Core without a model." }
        view: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/ViewBlock' } }
        notes:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code: { enum: [model_knowledge, core_summary, ungrounded_numbers, view_trimmed, task_failed, unverified_outcome] }
              detail: { type: string }
        files: { type: array, items: { type: string } }
        created_at: { type: integer, description: Unix milliseconds }
    ViewBlock:
      type: object
      description: One declarative block. Data only - never HTML or script. Sanitised by the Core.
      required: [type]
      properties:
        type: { enum: [text, callout, metrics, kv, table, list, steps, chart, links, code, actions] }
        title: { type: string }
        text: { type: string }
        tone: { enum: [info, success, warning, danger] }
        chart: { enum: [bar, line, pie] }
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: { type: string } } }
        items:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string }
              note: { type: string }
              url: { type: string }
              number: { type: number }
    TaskEvent:
      type: object
      required: [seq, type, at]
      properties:
        seq: { type: integer }
        type: { type: string, examples: [TASK_CREATED, STEP_STARTED, STEP_SUCCEEDED, APPROVAL_REQUESTED, OUTCOME_UNKNOWN] }
        step_id: { type: [string, 'null'] }
        actor: { enum: [core, worker, owner] }
        at: { type: string, format: date-time }
        data: { type: object, description: Redacted; never contains secrets or capability tokens }
    Approval:
      type: object
      required: [id, task_id, status, action_hash, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        task_id: { $ref: '#/components/schemas/Ulid' }
        step_id: { $ref: '#/components/schemas/Ulid' }
        status: { enum: [pending, approved, rejected, expired, consumed, invalidated] }
        tool_id: { type: string }
        side_effect: { enum: [pure, read, write_idempotent, write_external] }
        target: { type: string }
        parameters: { type: object }
        action_hash: { type: string }
        expires_at: { type: string, format: date-time }
        nonce: { type: string, description: Random value bound to this approval (ODI A3) }
        auth_strength: { type: string, description: "How the approver authenticated: owner_web_step_up_totp | owner_web_session | owner_token | member_token | unknown" }
        risk_class: { enum: [R0, R1, R2, R3, R4], description: Risk label under policy_version; labels only, never relaxes the A0-A3 enforcement }
        policy_version: { type: string }
        consumed_at: { type: integer }
        revoked_at: { type: integer }
        revoke_reason: { type: string }
    AuditChain:
      type: object
      required: [valid, chained, legacy_unchained, head]
      properties:
        valid: { type: boolean }
        chained: { type: integer, description: Rows covered by the hash chain }
        legacy_unchained: { type: integer, description: Rows written before the chain started (not verifiable) }
        head: { type: string, description: Hash of the newest chained row }
        broken_at: { type: string }
        broken_why: { type: string }
    TreeNode:
      type: object
      required: [task, tree_cost_usd, children]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        tree_cost_usd: { type: number }
        children: { type: array, items: { $ref: '#/components/schemas/TreeNode' } }
    Health:
      type: object
      required: [live, ready]
      properties:
        live: { type: boolean }
        ready: { type: boolean }
        version: { type: string }
        checks: { type: object, additionalProperties: { type: string } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, examples: [invalid_input, unauthorized, not_found, conflict, rate_limited, approval_mismatch, approval_expired] }
            message: { type: string }
            request_id: { type: string }
