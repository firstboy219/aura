# Illustrative only (Blueprint §13). Final schema is defined in Phase 1 (ADR-0002).
server:
  bind: "0.0.0.0:7400"          # inside the container; published on host loopback only
  token_file: /run/aura-secrets/api_token
database:
  path: /var/lib/aura/aura.db
workspace:
  root: /var/lib/aura/workspace
worker:
  max_workers: 1
  idle_timeout_seconds: 60
  max_concurrent_tasks: 1
budgets:
  task_default: { max_cost_usd: 0.50, max_iterations: 20, max_wall_seconds: 900 }
  global: { daily_cost_usd: 5.00 }
providers:
  openrouter:
    key_file: /run/aura-secrets/openrouter_key
models:   # route IDs are verified in P1; MODEL_ASSIGNMENT.md is MISSING
  fast:     { provider: openrouter, model_ref: "<verified route ID>", reasoning_effort: low }
  standard: { provider: openrouter, model_ref: "<verified route ID>", reasoning_effort: medium }
  deep:     { provider: openrouter, model_ref: "<verified route ID>", reasoning_effort: high }
tools:
  web.fetch: { allow_domains: [], max_bytes: 2000000, timeout_seconds: 20 }
