# AURA Core configuration for the aura-core container (ADR-0002).
# Holds paths to secrets, never secret values. Copied to /opt/aura/config.yaml by deploy/setup-host.sh.
config_version: 1
server:
  bind: "0.0.0.0:7400"            # inside the container; published on host 127.0.0.1:7400 only
  token_file: /var/lib/aura/api_token
  rate_per_second: 20
database:
  path: /var/lib/aura/aura.db
  backup_dir: /var/lib/aura/backups
workspace:
  root: /var/lib/aura/workspace
worker:
  command: ["python3", "-I", "-m", "aura_worker"]
  idle_timeout_seconds: 60
  max_workers: 1
  max_concurrent_tasks: 1
  scratch_root: /tmp/aura-scratch
  call_timeout_seconds: 300
budgets:
  task_default: { max_cost_usd: 0.50, max_iterations: 20, max_wall_seconds: 900 }
  global: { daily_cost_usd: 5.00 }
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_file: /run/aura-secrets/openrouter_key
    timeout_seconds: 120
# Model profile (ASSUMPTIONS A-13, A-20). MODEL_ASSIGNMENT.md is MISSING, so this is provisional.
# Free routes come first but serve ONLY tasks created with data_class "public" (CLI: --public), because free
# endpoints may log or train on prompts. Private tasks skip them and use the paid routes (need OpenRouter credit).
# Route IDs, structured-output support and prices verified against the OpenRouter catalog on 2026-11-09.
models:
  fast:
    - { display_name: "Nemotron 3.5 Super VL (free)", api_model_id: "nvidia/nemotron-3.5-super-vl", route_id: "nvidia/nemotron-3.5-super-vl:free",
        free: true, prompt_logging: may_log, structured_output: native, max_output_tokens: 6000 }
    - { display_name: "OpenRouter free router", api_model_id: "openrouter/free", route_id: "openrouter/free",
        free: true, prompt_logging: may_log, structured_output: native, max_output_tokens: 6000 }
    - { display_name: "Claude Haiku 5.5", api_model_id: "claude-haiku-5-5", route_id: "anthropic/claude-haiku-5.5",
        reasoning_effort: low, price_in_per_mtok: 0.10, price_out_per_mtok: 0.50, max_output_tokens: 4000 }
    - { display_name: "Claude Haiku 4.5", api_model_id: "claude-haiku-4-5", route_id: "anthropic/claude-haiku-4.5",
        reasoning_effort: low, price_in_per_mtok: 1.00, price_out_per_mtok: 5.00, max_output_tokens: 4000 }
  standard:
