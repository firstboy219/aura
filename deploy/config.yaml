    - { display_name: "Claude Sonnet 5.5", api_model_id: "claude-sonnet-5-5", route_id: "anthropic/claude-sonnet-5.5",
        reasoning_effort: medium, price_in_per_mtok: 2.00, price_out_per_mtok: 10.00, max_output_tokens: 6000 }
    - { display_name: "Claude Sonnet 5", api_model_id: "claude-sonnet-5", route_id: "anthropic/claude-sonnet-5",
