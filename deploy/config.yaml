# AURA Core configuration for the aura-core container (ADR-0002).
# Holds paths to secrets, never secret values. Copied to /opt/aura/config.yaml by deploy/setup-host.sh.
config_version: 1
server:
  bind: "0.0.0.0:7400"            # inside the container; published on host 127.0.0.1:7400 only
  token_file: /var/lib/aura/api_token
  rate_per_second: 20
database:
  path: /var/lib/aura/aura.db
  backup_dir: /var/lib/aura/backups
workspace:
  root: /var/lib/aura/workspace
worker:
  # The worker runs isolated in the aura-worker container (ADR-0035); the Core reaches it through this bridge.
  # For a single-container development setup use ["python3", "-I", "-m", "aura_worker"].
  command: ["aura", "worker-connect", "--socket", "/run/aura-worker/worker.sock"]
  idle_timeout_seconds: 60
  max_workers: 1
  max_concurrent_tasks: 1
  scratch_root: /tmp/aura-scratch
  call_timeout_seconds: 300
budgets:
  task_default: { max_cost_usd: 0.50, max_iterations: 20, max_wall_seconds: 900 }
  global: { daily_cost_usd: 5.00 }
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_file: /run/aura-secrets/openrouter_key
    timeout_seconds: 120
# Model profile (ASSUMPTIONS A-13, A-20). MODEL_ASSIGNMENT.md is MISSING, so this is provisional.
# Free routes come first but serve ONLY tasks created with data_class "public" (CLI: --public), because free
# endpoints may log or train on prompts. Private tasks skip them and use the paid routes (need OpenRouter credit).
# Route IDs, structured-output support and prices verified against the OpenRouter catalog on 2026-11-09.
models:
  fast:
    - { display_name: "Nemotron 3.5 Super VL (free)", api_model_id: "nvidia/nemotron-3.5-super-vl", route_id: "nvidia/nemotron-3.5-super-vl:free",
        free: true, prompt_logging: may_log, structured_output: native, max_output_tokens: 6000 }
    - { display_name: "OpenRouter free router", api_model_id: "openrouter/free", route_id: "openrouter/free",
        free: true, prompt_logging: may_log, structured_output: native, max_output_tokens: 6000 }
    - { display_name: "Claude Haiku 5.5", api_model_id: "claude-haiku-5-5", route_id: "anthropic/claude-haiku-5.5",
        reasoning_effort: low, price_in_per_mtok: 0.10, price_out_per_mtok: 0.50, max_output_tokens: 4000 }
    - { display_name: "Claude Haiku 4.5", api_model_id: "claude-haiku-4-5", route_id: "anthropic/claude-haiku-4.5",
        reasoning_effort: low, price_in_per_mtok: 1.00, price_out_per_mtok: 5.00, max_output_tokens: 4000 }
  standard:
    - { display_name: "Nemotron 3.5 Super VL (free)", api_model_id: "nvidia/nemotron-3.5-super-vl", route_id: "nvidia/nemotron-3.5-super-vl:free",
        free: true, prompt_logging: may_log, structured_output: native, max_output_tokens: 6000 }
    - { display_name: "Nemotron 3 Ultra 550B (free)", api_model_id: "nvidia/nemotron-3-ultra-550b-a55b", route_id: "nvidia/nemotron-3-ultra-550b-a55b:free",
        free: true, prompt_logging: may_log, structured_output: prompt, max_output_tokens: 6000 }
    - { display_name: "OpenRouter free router", api_model_id: "openrouter/free", route_id: "openrouter/free",
        free: true, prompt_logging: may_log, structured_output: native, max_output_tokens: 6000 }
    - { display_name: "Claude Sonnet 5.5", api_model_id: "claude-sonnet-5-5", route_id: "anthropic/claude-sonnet-5.5",
        reasoning_effort: medium, price_in_per_mtok: 2.00, price_out_per_mtok: 10.00, max_output_tokens: 6000 }
    - { display_name: "Claude Sonnet 5", api_model_id: "claude-sonnet-5", route_id: "anthropic/claude-sonnet-5",
        reasoning_effort: medium, price_in_per_mtok: 2.00, price_out_per_mtok: 10.00, max_output_tokens: 6000 }
  deep:
    - { display_name: "Nemotron 3 Ultra 550B (free)", api_model_id: "nvidia/nemotron-3-ultra-550b-a55b", route_id: "nvidia/nemotron-3-ultra-550b-a55b:free",
        free: true, prompt_logging: may_log, structured_output: prompt, max_output_tokens: 6000 }
    - { display_name: "Nemotron 3.5 Super VL (free)", api_model_id: "nvidia/nemotron-3.5-super-vl", route_id: "nvidia/nemotron-3.5-super-vl:free",
        free: true, prompt_logging: may_log, structured_output: native, max_output_tokens: 6000 }
    - { display_name: "Claude Opus 5.5", api_model_id: "claude-opus-5-5", route_id: "anthropic/claude-opus-5.5",
        reasoning_effort: high, price_in_per_mtok: 4.00, price_out_per_mtok: 20.00, max_output_tokens: 8000 }
    - { display_name: "Claude Opus 5", api_model_id: "claude-opus-5", route_id: "anthropic/claude-opus-5",
        reasoning_effort: high, price_in_per_mtok: 5.00, price_out_per_mtok: 25.00, max_output_tokens: 8000 }
tools:
  web.fetch: { allow_domains: [], max_bytes: 2000000, timeout_seconds: 20 }
  # Search results can only be fetched if their domain is in the task's allow_domains (e.g. "*.wikipedia.org").
  web.search: { provider: wikipedia, wikipedia_lang: en, max_results: 8 }
approvals:
  ttl_seconds: 1800
# Browser automation v1 (ADR-0039): the isolated browser host and the Core's egress proxy (the browser's only way out).
browser: { socket: /run/aura-browser/browser.sock, proxy_listen: ":7480" }
# and set server.deny_cidrs: ["172.31.250.0/24"] so the browser network can never reach the API.
# Workspace Web App (ADR-0041), reached through the Cloudflare Tunnel. Session cookies count only on the origin;
# api_hosts serve the bearer-token API only.
# web: { enabled: true, origin: "https://aura.example.com", api_hosts: ["aurax.example.com"], session_hours: 12,
#        trusted_proxy_cidrs: ["172.21.0.0/16"] }
# Messaging channel (ADR-0044): a Telegram bot that serves only your user id. Token: aura admin credential set telegram --stdin
# channels: { telegram: { enabled: true, token_ref: "vault:connector.telegram", allowed_user_ids: [123456789],
#             default_tools: [web.search, web.fetch, workspace.write], default_domains: ["*.wikipedia.org"] } }
# Connector pilot (ADR-0045): GitHub read-only, fine-grained token limited to chosen repos; the Core re-checks the allowlist.
# connectors: { github: { enabled: true, token_ref: "vault:connector.github", repos: ["owner/repo"] } }
# Login profiles, downloads and uploads (ADR-0040). Example (disabled):
# browser:
#   downloads: true            # quarantined; only download_types enter the workspace
#   max_download_mb: 20
#   uploads_enabled: false     # each upload needs an approval bound to the file hash
#   logins:
#     - { name: shop, domains: [shop.example.com], username: "me@example.com", password_ref: "vault:shop-password" }
# then: aura secrets import shop-password --stdin   and submit tasks with --browser-profile shop
# Authenticated inbound webhooks (Blueprint §8.11, ADR-0034). The API listens on loopback only: an external sender needs
# a TLS reverse proxy that you set up. Example (disabled):
# webhooks:
#   - { name: ci, secret_file: /opt/aura/secrets/webhook_ci, event_key: build-42 }
# Encrypted secrets at rest (ADR-0036): create a key with `aura secrets keygen /run/aura-secrets/master.key`, then
# `aura secrets import openrouter --from-file /run/aura-secrets/openrouter_key` and use key_file: "vault:openrouter".
# secrets: { master_key_file: /run/aura-secrets/master.key }
# Per-tier prompt budget in characters (Blueprint OL-05): observations are trimmed to fit.
prompt_budget_chars: { fast: 24000, standard: 60000, deep: 120000 }
# Unanswered clarification questions (Blueprint §8.2, ADR-0032): one reminder, then fail (or continue with stated assumptions).
inputs: { remind_after_seconds: 14400, timeout_seconds: 172800, on_timeout: fail }
# MCP servers (ADR-0020): only the tools listed here are exposed, with the tier and side effect YOU set.
# Example (disabled):
# mcp:
#   servers:
#     - name: notes
#       command: ["python3", "-I", "/opt/aura/mcp/notes_server.py"]
#       timeout_seconds: 30
#       tools:
#         search_notes: { tier: A0, side_effect: read, description: "Search the owner's notes by keyword." }
#         add_note:     { tier: A2, side_effect: write_external, description: "Add a note (needs approval)." }
#
# Second model provider (ADR-0021), used by routes with provider: <id>. Example (disabled):
# providers:
#   openai_compatible:
#     - { id: groq, base_url: "https://api.groq.com/openai/v1", key_file: /run/aura-secrets/groq_key }
# Adaptive routing (ADR-0054): on by default. Set no_tier_rescue: true to keep a call inside its own tier.
# routing: { no_tier_rescue: false }
# A free route that is not the last candidate gets this long to answer before the next one is tried (-1 = no limit):
# routing: { free_patience_seconds: { fast: 20, standard: 45, deep: 90 } }
# Owner reply with adaptive view (ADR-0055): on by default.
# reply: { disabled: false }
