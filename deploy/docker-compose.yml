# AURA — its own Compose project. Shares nothing with Jarvis:
# no jarvis_jarvis-network, no Jarvis volumes, no Jarvis ports, no proxy registration.
# Start only on an explicit owner command (AGENTS.md "Deployment").
name: aura

services:
  aura-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aura-core:local
    container_name: aura-core
    # Phase 0 image only implements `doctor`; Phase 1 switches this to `serve`.
    command: ["doctor"]
    restart: "no"
    ports:
      - "127.0.0.1:7400:7400"   # loopback only (Blueprint §11)
    volumes:
      - aura-data:/var/lib/aura
      - /opt/aura/config.yaml:/etc/aura/config.yaml:ro
      - /opt/aura/secrets:/run/aura-secrets:ro   # Core reads; worker env never receives them
    networks: [aura-net]
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  aura-net:
    name: aura-net

volumes:
  aura-data:
    name: aura-data
