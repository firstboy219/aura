# AURA — its own Compose project (Blueprint §15, independence): own network, own volume, loopback-only port,
# no other product's networks, volumes or proxy registration.
# Start only on an explicit owner command (AGENTS.md "Deployment").
name: aura

services:
  aura-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aura-core:local
    container_name: aura-core
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7400:7400"   # loopback only (Blueprint §11)
    environment:
      AURA_CONFIG: /etc/aura/config.yaml
    volumes:
      - aura-data:/var/lib/aura
      - /opt/aura/config.yaml:/etc/aura/config.yaml:ro
      - /opt/aura/secrets:/run/aura-secrets:ro   # read by Core only; never in the worker environment
    networks: [aura-net]
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7400/api/v1/system/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  aura-net:
    name: aura-net

volumes:
  aura-data:
    name: aura-data
